<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurix HUD demo</title>
<style>
:root{
  --bg:#0d161a; --deep:#0a1114; --row:#111d22;
  --line:#329cdc; --accent:#60c0ff; --accentdim:#3c7aa0; --fade:#204760;
  --txt:#a0dbff; --dim:#3a6380; --light:#82a7be;
  --green:#78ffa0; --red:#ff6060; --yel:#ffd23c;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --font:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--deep); color:var(--txt); font-family:var(--font);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}

/* fake in-game backdrop so the HUD reads against something */
.stage{
  position:fixed; inset:0;
  background:
    radial-gradient(120% 80% at 20% 0%, #14313c 0%, transparent 60%),
    radial-gradient(90% 70% at 85% 100%, #10242e 0%, transparent 55%),
    linear-gradient(180deg, #0b1a20 0%, #071114 100%);
}
.stage::after{
  content:""; position:absolute; inset:0; opacity:.5;
  background-image:
    linear-gradient(rgba(50,156,220,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(50,156,220,.055) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(90% 80% at 30% 40%, #000 20%, transparent 75%);
}

.hint{
  position:fixed; left:18px; bottom:18px; z-index:5;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 12px; border-radius:12px;
  background:rgba(10,17,20,.82); border:1px solid rgba(50,156,220,.28);
  backdrop-filter:blur(10px);
  font-size:11px; color:var(--dim); max-width:calc(100vw - 320px)
}
.hint b{color:var(--light); font-weight:600}
.hint .k{
  font-family:var(--mono); font-size:10px; color:var(--txt);
  padding:2px 6px; border-radius:5px; background:rgba(96,192,255,.13);
  border:1px solid rgba(96,192,255,.3)
}
.hint button{
  font-family:var(--font); font-size:10.5px; font-weight:700; cursor:pointer;
  padding:5px 9px; border-radius:7px; color:var(--accent);
  background:rgba(96,192,255,.1); border:1px solid rgba(96,192,255,.4);
  transition:background .16s var(--ease), border-color .16s var(--ease), color .16s
}
.hint button:hover{background:rgba(96,192,255,.2); border-color:var(--accent)}
.hint button:active{transform:translateY(1px)}

/* ───────── the HUD itself ───────── */
.hud{
  position:fixed; right:22px; top:120px; z-index:40;
  width:214px;
  border-radius:12px;
  background:linear-gradient(180deg, rgba(13,22,26,.94), rgba(10,17,20,.92));
  border:1px solid rgba(50,156,220,.34);
  box-shadow:0 18px 44px rgba(0,0,0,.55), inset 0 1px 0 rgba(160,219,255,.07);
  backdrop-filter:blur(14px);
  user-select:none;
  animation:hudIn .5s var(--spring) both;
  transition:opacity .24s var(--ease), transform .3s var(--ease)
}
.hud.dragging{transition:none; cursor:grabbing; box-shadow:0 26px 60px rgba(0,0,0,.7)}
.hud.off{opacity:0; transform:scale(.96); pointer-events:none}
@keyframes hudIn{from{opacity:0; transform:translateY(-8px) scale(.97)} to{opacity:1; transform:none}}

/* drag handle */
.grip{
  display:flex; align-items:center; gap:7px;
  height:30px; padding:0 10px;
  cursor:grab; touch-action:none;
  border-bottom:1px solid rgba(50,156,220,.22)
}
.hud.dragging .grip{cursor:grabbing}
.gdot{
  width:6px; height:6px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 8px rgba(96,192,255,.9);
  animation:pulse 2.4s ease-in-out infinite
}
@keyframes pulse{50%{opacity:.35}}
.gcount{font-size:9.5px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--dim)}
.gmark{
  margin-left:auto; font-size:9px; font-weight:800; letter-spacing:2px;
  color:var(--accentdim); font-family:var(--mono)
}

.list{display:flex; flex-direction:column; gap:5px; padding:7px}
.list:empty{display:none}

.feat{
  position:relative; display:flex; align-items:center; gap:7px;
  height:30px; max-height:30px; padding:0 8px; overflow:hidden;
  border-radius:8px; cursor:pointer; text-align:left;
  font-family:var(--font); color:var(--txt);
  background:rgba(17,29,34,.9); border:1px solid rgba(50,156,220,.2);
  animation:pillIn .32s var(--spring) both;
  transition:background .16s var(--ease), border-color .16s var(--ease),
             transform .22s var(--spring), opacity .2s var(--ease),
             max-height .26s var(--ease), padding .26s var(--ease), margin .26s var(--ease)
}
@keyframes pillIn{
  from{opacity:0; transform:translateX(-10px) scale(.96)}
  to{opacity:1; transform:none}
}
.feat:hover{background:rgba(20,34,40,.98); border-color:rgba(50,156,220,.55)}
.feat:active{transform:scale(.985)}
.feat .d{
  width:5px; height:5px; border-radius:50%; background:var(--green);
  box-shadow:0 0 6px rgba(120,255,160,.7); flex:0 0 auto
}
.feat .n{
  font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  flex:1; min-width:0
}
.feat .v{
  font-size:9.5px; font-family:var(--mono); color:var(--accent);
  padding:1px 5px; border-radius:4px; background:rgba(96,192,255,.12);
  flex:0 0 auto; transition:opacity .16s
}
.feat:hover .v{opacity:0}
.feat .x{
  position:absolute; right:6px; top:50%; transform:translate(6px,-50%);
  font-size:13px; line-height:1; color:var(--red); opacity:0;
  transition:opacity .16s var(--ease), transform .22s var(--spring)
}
.feat:hover .x{opacity:1; transform:translate(0,-50%)}

/* removal: the animation has to be cleared or its fill-mode wins over the transition */
.feat.out{
  animation:none;
  max-height:0; padding-top:0; padding-bottom:0; margin-top:-5px;
  opacity:0; transform:translateX(14px); border-color:transparent; pointer-events:none
}

/* empty state */
.none{
  padding:10px 10px 12px; font-size:10px; color:var(--dim); text-align:center;
  display:none
}
.hud.empty .none{display:block}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="stage"></div>

<div class="hud" id="hud">
  <div class="grip" id="grip">
    <span class="gdot"></span>
    <span class="gcount" id="count">4 active</span>
    <span class="gmark">AURIX</span>
  </div>
  <div class="list" id="list"></div>
  <div class="none">Nothing enabled</div>
</div>

<div class="hint">
  <span><b>Drag</b> the bar to move it, <b>click a pill</b> to disable that feature.</span>
  <span class="k">H</span><span>hide</span>
  <button id="addBtn">Enable Chams</button>
  <button id="allBtn">Restore all</button>
</div>

<script>
(function(){
  "use strict";

  // In Roblox these lines are replaced by tab:CreateToggle callbacks
  // that call hud:Add(name, value) and hud:Remove(name).
  var FEATURES = [
    { key:"silentaim",  name:"Silent Aim",  value:"Head" },
    { key:"aimassist",  name:"Aim Assist",  value:"0.35" },
    { key:"fullbright", name:"Fullbright",  value:"" },
    { key:"boxes",      name:"ESP Boxes",   value:"#9BE7FF" }
  ];

  var hud   = document.getElementById("hud");
  var grip  = document.getElementById("grip");
  var list  = document.getElementById("list");
  var count = document.getElementById("count");

  function refresh(){
    var n = list.children.length;
    count.textContent = n + " active";
    hud.classList.toggle("empty", n === 0);
  }

  function makePill(f){
    var b = document.createElement("button");
    b.className = "feat";
    b.dataset.key = f.key;
    b.innerHTML = '<span class="d"></span><span class="n"></span><span class="v"></span><span class="x">\u00d7</span>';
    b.querySelector(".n").textContent = f.name;
    var v = b.querySelector(".v");
    if(f.value){ v.textContent = f.value; } else { v.style.display = "none"; }
    b.addEventListener("click", function(){ remove(f.key); });
    return b;
  }

  function add(f){
    if(list.querySelector('[data-key="' + f.key + '"]')) return;
    var pill = makePill(f);
    // stagger by position so a burst of toggles cascades instead of popping as one block
    pill.style.animationDelay = (list.children.length * 45) + "ms";
    list.appendChild(pill);
    refresh();
  }

  function remove(key){
    var pill = list.querySelector('[data-key="' + key + '"]');
    if(!pill) return;
    pill.classList.add("out");
    setTimeout(function(){
      if(pill.parentNode) pill.parentNode.removeChild(pill);
      refresh();
    }, 240);
  }

  // seed
  FEATURES.forEach(add);

  // ── drag the grip ─────────────────────────────────────────────────────────
  var dragging = false, offX = 0, offY = 0;
  grip.addEventListener("pointerdown", function(e){
    dragging = true;
    var r = hud.getBoundingClientRect();
    offX = e.clientX - r.left;
    offY = e.clientY - r.top;
    hud.classList.add("dragging");
    // switch from right/top anchoring to left/top so the maths stays simple
    hud.style.left = r.left + "px";
    hud.style.top  = r.top + "px";
    hud.style.right = "auto";
    grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var w = hud.offsetWidth, h = hud.offsetHeight;
    var x = Math.min(Math.max(6, e.clientX - offX), innerWidth - w - 6);
    var y = Math.min(Math.max(6, e.clientY - offY), innerHeight - h - 6);
    hud.style.left = x + "px";
    hud.style.top  = y + "px";
  });
  grip.addEventListener("pointerup", function(){
    dragging = false;
    hud.classList.remove("dragging");
  });
  grip.addEventListener("pointercancel", function(){
    dragging = false;
    hud.classList.remove("dragging");
  });

  // ── demo controls ─────────────────────────────────────────────────────────
  var extra = [
    { key:"chams",    name:"Chams",      value:"#9BE7FF" },
    { key:"noclip",   name:"Noclip",     value:"" },
    { key:"speed",    name:"Walk Speed", value:"120" }
  ];
  document.getElementById("addBtn").addEventListener("click", function(){
    var next = extra.find(function(f){ return f.key === "chams" && !list.querySelector('[data-key="chams"]'); });
    if(next) add(next);
  });
  document.getElementById("allBtn").addEventListener("click", function(){
    FEATURES.concat(extra).forEach(add);
  });

  window.addEventListener("keydown", function(e){
    if(e.key === "h" || e.key === "H") hud.classList.toggle("off");
    if(e.key === "r" || e.key === "R") FEATURES.concat(extra).forEach(add);
  });

  refresh();
})();
</script>
</body>
</html>
